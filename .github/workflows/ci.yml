name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NB: deliberately no global `RUSTFLAGS: -D warnings`. RUSTFLAGS applies to
  # dependencies too, so a warning anywhere in the zellij-utils tree would fail
  # our build. Each clippy invocation passes `-D warnings` explicitly instead,
  # which only denies warnings in our own crates.

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Only zclip-core is linted natively here; zclip (the cdylib) pulls in
      # zellij-utils' native-only deps (openssl-sys/curl-sys/tokio/...) when
      # built for the host target, so it is only ever clippy'd/built for
      # wasm32-wasip1 (see build-wasm job).
      - name: cargo clippy -p zclip-core
        run: cargo clippy -p zclip-core --all-targets -- -D warnings

  test:
    name: native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      # zclip-core has zero dependencies and builds/tests natively in <1s.
      # zclip depends on zellij-tile -> zellij-utils, which on a native
      # (non-wasm) target transitively pulls in isahc -> curl -> curl-sys +
      # openssl-sys, plus tokio/rusqlite/notify/log4rs/interprocess. Running
      # `cargo test` against zclip (or a bare workspace `cargo test`) would
      # require apt-installed libssl-dev/libcurl4-openssl-dev and make this
      # job ~70x slower for no benefit, since zclip only ever runs as wasm.
      # So we scope native tests to `-p zclip-core` only; zclip is exercised
      # by the wasm build/clippy in the build-wasm job instead.
      - name: cargo test -p zclip-core
        run: cargo test -p zclip-core --all-targets

  build-wasm:
    name: wasm32-wasip1 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-wasm

      - name: cargo clippy --workspace (wasm32-wasip1)
        run: cargo clippy --workspace --target wasm32-wasip1 --all-targets -- -D warnings

      - name: cargo build --workspace --release (wasm32-wasip1)
        run: cargo build --workspace --target wasm32-wasip1 --release

      - name: verify wasm artifact exists
        run: |
          test -f target/wasm32-wasip1/release/zclip.wasm
          ls -lh target/wasm32-wasip1/release/zclip.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: zclip-wasm
          path: target/wasm32-wasip1/release/zclip.wasm

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    # Deliberately no Swatinem/rust-cache here: Nix does its own build in its
    # own store (/nix/store), sharing nothing with the cargo jobs above, so
    # cargo's cache would neither help this job nor be helped by it.
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Two invocations, not one, because they check different things and
      # this runner can only do one of them for real:
      #
      # `--no-build` first: flake.nix advertises x86_64-linux, aarch64-linux
      # and aarch64-darwin (see the x86_64-darwin comment in flake.nix for
      # why not that too), but an x86_64-linux runner cannot *build* the two
      # aarch64 derivations. It can still *evaluate* them, and evaluation is
      # exactly where a typo'd attribute path or a system-specific expression
      # error would show up. Skipping this would mean an eval error on a
      # platform nobody on the team runs day-to-day only surfaces on a
      # contributor's machine, possibly mid-release.
      - name: nix flake check --all-systems (evaluation)
        run: nix flake check --all-systems --no-build

      # Then the real thing: build whatever this runner's system (x86_64-linux)
      # can build, i.e. the `checks.zclip` derivation added for this purpose.
      - name: nix flake check
        run: nix flake check --print-build-logs

      # `nix flake check` proves the derivation *builds*, not that `$out`
      # contains anything useful -- an installPhase that silently installed
      # nothing would still exit 0. The store paths were already built by
      # the previous step, so `nix build` here is a store lookup (the
      # derivation is already realized), not a rebuild.
      - name: verify the flake package installs the plugin and the example config
        run: |
          nix build .#zclip --print-build-logs
          test -f result/bin/zclip.wasm
          test -f result/share/zclip/zclip.kdl
          ls -lh result/bin/zclip.wasm

      # Runs the documented path itself rather than a proxy for it: this is
      # verbatim what 06-nix-devshell.md promises a contributor can do on a
      # machine with no rustup, and what docs/dev.md now tells them to do.
      # Probing the toolchain instead would be weaker -- `rustc --version`
      # says nothing about targets, and `rustc --print target-list` lists
      # every target rustc merely *knows about*, including ones with no std
      # installed, so it passes on a toolchain that cannot build this plugin.
      # `just build` also covers the shell providing `just` at all.
      #
      # This does compile the tree a second time (into cargo's own target/,
      # sharing nothing with the nix build above, and with no rust-cache to
      # fall back on). That duplication is deliberate: the point is that the
      # devShell works for a human running the documented command, which a
      # sandboxed nix build does not demonstrate.
      - name: verify `nix develop` + `just build` produces the plugin
        run: |
          nix develop --command just build
          test -f target/wasm32-wasip1/debug/zclip.wasm
          ls -lh target/wasm32-wasip1/debug/zclip.wasm
