name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing the GitHub release (build/optimize/checksum only)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NB: deliberately no global `RUSTFLAGS: -D warnings`, same reasoning as
  # ci.yml: RUSTFLAGS applies to dependencies too, so a warning anywhere in
  # the zellij-utils tree would fail this build. Each clippy invocation
  # passes `-D warnings` explicitly instead.
  #
  # Pin wasm-opt (Binaryen) to an exact version rather than "latest" so a
  # future Binaryen release can't silently change the bytes we ship without
  # us noticing and re-verifying.
  BINARYEN_VERSION: version_123

jobs:
  release:
    name: build, optimize, and publish zclip.wasm
    runs-on: ubuntu-latest
    # Scoped to the job rather than the workflow: this workflow only ever
    # has this one job, and keeping `contents: write` job-scoped (instead of
    # blanket at the workflow level) means anyone adding a second job later
    # doesn't inherit write access to the repo by accident.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      # The single most valuable check in this workflow: a tag that disagrees
      # with `workspace.package.version` produces an artifact that lies about
      # what it is. Every consumer (users manually installing the plugin, the
      # compat-matrix tooling in #63, this workflow's own release notes) trusts
      # the tag to describe the binary, so we fail loudly rather than publish
      # a mismatch. Only runs for actual tag pushes; workflow_dispatch has no
      # tag to check against.
      - name: verify tag matches workspace.package.version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate_version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$tag" != "$crate_version" ]; then
            echo "::error::tag v$tag does not match workspace.package.version ($crate_version)"
            echo "Pushed tag:  v$tag"
            echo "Cargo.toml:  $crate_version"
            exit 1
          fi
          echo "tag v$tag matches workspace.package.version ($crate_version)"

      # Mirrors ci.yml's test/lint jobs. zclip-core is the only crate ever
      # built/tested for the host target (see ci.yml for why zclip must not
      # be: zellij-tile -> zellij-utils pulls in openssl-sys/curl-sys/tokio
      # on non-wasm targets).
      - name: cargo test -p zclip-core
        run: cargo test -p zclip-core --all-targets

      - name: cargo clippy --workspace (wasm32-wasip1)
        run: cargo clippy --workspace --target wasm32-wasip1 --all-targets -- -D warnings

      - name: cargo build --workspace --release (wasm32-wasip1)
        run: cargo build --workspace --target wasm32-wasip1 --release

      # zclip is a Zellij *plugin*: a single wasm32-wasip1 binary that Zellij
      # loads directly, with no host-specific code paths. WASM is portable by
      # design, so unlike a typical CLI release there is no OS/arch build
      # matrix and no "static linux64" artifact here -- one zclip.wasm serves
      # every platform Zellij itself runs on. If you're looking for a matrix,
      # this is why there isn't one.
      - name: install wasm-opt (Binaryen ${{ env.BINARYEN_VERSION }})
        run: |
          curl -sSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      # -Oz matches Cargo.toml's release profile (opt-level = "z"): optimize
      # for size, not speed, since this binary is downloaded over HTTP by
      # end users. The --enable-* flags are required because rustc's
      # wasm32-wasip1 output already uses these WASM features (bulk memory
      # for memcpy/memset lowering, in particular) and wasm-opt's validator
      # rejects them without being told they're expected; empirically
      # verified against this crate's actual output, not guessed.
      - name: wasm-opt -Oz
        run: |
          in=target/wasm32-wasip1/release/zclip.wasm
          before=$(stat -c%s "$in")
          wasm-opt -Oz \
            --enable-bulk-memory \
            --enable-sign-ext \
            --enable-mutable-globals \
            --enable-nontrapping-float-to-int \
            "$in" -o zclip.wasm
          after=$(stat -c%s zclip.wasm)
          echo "size before wasm-opt: $before bytes"
          echo "size after wasm-opt:  $after bytes"

      # A wasm-opt run that silently produced garbage (truncated output,
      # empty file, a stray error page from a bad download) must not reach a
      # release. Check existence, non-emptiness, and the `\0asm` magic bytes
      # that every valid WASM module starts with.
      - name: sanity-check optimized artifact
        run: |
          test -s zclip.wasm
          magic=$(head -c4 zclip.wasm | od -An -tx1 | tr -d ' ')
          if [ "$magic" != "0061736d" ]; then
            printf '::error::zclip.wasm does not start with the \\0asm magic bytes (got: %s)\n' "$magic"
            exit 1
          fi
          echo "zclip.wasm looks like a valid WASM module ($(stat -c%s zclip.wasm) bytes)"

      - name: sha256sum
        run: |
          sha256sum zclip.wasm > zclip.wasm.sha256
          cat zclip.wasm.sha256

      # Unconditional (not gated on dry_run or tag pushes) so a manual
      # workflow_dispatch dry run still yields a downloadable artifact to
      # sanity-check, per roadmap #62's requirement that a dry run produce a
      # verifiable result without actually publishing.
      - uses: actions/upload-artifact@v4
        with:
          name: zclip-wasm
          path: |
            zclip.wasm
            zclip.wasm.sha256

      # Only tag pushes create a GitHub release, and only when this wasn't a
      # dry run (workflow_dispatch defaults dry_run to true specifically so
      # the rest of this workflow can be exercised without publishing).
      - name: create GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          files: |
            zclip.wasm
            zclip.wasm.sha256
          # e.g. v0.1.0-rc1: hyphenated tags are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
